function genClap(){
  var by=[1,2,3,4].map(function(n){return shuffle(SYL.filter(function(x){return x.s.length===n;}));});
  var pick=[by[0][0],by[1][0],by[2][0],by[1][1],by[2][1],by[3][0]];
  return shuffle(pick.filter(function(x){return x;}));
}
var RHYMES=[
 {t:{w:'باب',e:'🚪'},g:{w:'كِتاب',e:'📕'},d:[{w:'قِطّ',e:'🐈'},{w:'شَمْس',e:'☀️'}]},
 {t:{w:'نار',e:'🔥'},g:{w:'دار',e:'🏠'},d:[{w:'سَمَكَة',e:'🐟'},{w:'يَد',e:'✋'}]},
 {t:{w:'قَمَر',e:'🌙'},g:{w:'شَجَر',e:'🌳'},d:[{w:'باب',e:'🚪'},{w:'دُبّ',e:'🐻'}]},
 {t:{w:'جَمَل',e:'🐫'},g:{w:'عَسَل',e:'🍯'},d:[{w:'وَرْدَة',e:'🌹'},{w:'قِطّ',e:'🐈'}]},
 {t:{w:'حَليب',e:'🥛'},g:{w:'طَبيب',e:'🧑‍⚕️'},d:[{w:'شَمْس',e:'☀️'},{w:'قَمَر',e:'🌙'}]},
 {t:{w:'قَلَم',e:'✏️'},g:{w:'قَدَم',e:'🦶'},d:[{w:'باب',e:'🚪'},{w:'فيل',e:'🐘'}]},
 {t:{w:'دُبّ',e:'🐻'},g:{w:'حُبّ',e:'❤️'},d:[{w:'فيل',e:'🐘'},{w:'قَلَم',e:'✏️'}]}
];
function genRhyme(){
  return shuffle(RHYMES.slice()).slice(0,6).map(function(r){
    return {q:'أيّ كلمة تشبه نهايتُها نهايةَ كلمة « '+r.t.w+' » ؟',say:'أي كلمة تشبه نهايتها كلمة '+r.t.w,
      scene:'<div class="scene">'+r.t.e+'<div style="font-size:26px">'+r.t.w+'</div></div>',
      fb:'نعم! '+r.t.w+' … '+r.g.w+' : نهايتهما متشابهة.',
      opts:shuffle([{e:r.g.e,w:r.g.w,ok:true}].concat(r.d))};
  });
}
function genFusion(){
  return shuffle(SYL.filter(function(x){return x.s.length>=2;})).slice(0,6).map(function(x){
    var others=pickN(SYL.filter(function(y){return y.w!==x.w;}),3);
    return {q:'اِسمع المقاطع، ثمّ اجمعها: ما الكلمة؟',say:'اسمع المقاطع ثم اجمعها',seq:x.s,
      scene:'<div class="sylrow">'+x.s.map(function(p){return '<span class="syl">'+p+'</span>';}).join('<span class="plus">+</span>')+'</div>',
      fb:x.s.join(' + ')+' = '+x.w,
      opts:shuffle([{e:x.e,w:x.w,ok:true}].concat(others.map(function(o){return {e:o.e,w:o.w};})))};
  });
}
function genSameStart(){
  var r=[];
  pickN(WORDS,14).forEach(function(t){
    if(r.length>=6)return;
    var f=firstLetter(t.w);
    if(startsWithHamza(t.w))return;
    /* لا نضع كمشتِّت كلمةً تبدأ بصوت قريب جدًّا (س/ص، ت/ط، د/ض، ذ/ز/ظ، ه/ح، ك/ق، ث/س) */
    var NEAR={'س':'صث','ص':'س','ت':'ط','ط':'ت','د':'ض','ض':'د','ذ':'زظ','ز':'ذظ','ظ':'ذز','ه':'ح','ح':'ه','ك':'ق','ق':'ك','ث':'س'};
    var same=WORDS.filter(function(o){return o.w!==t.w&&firstLetter(o.w)===f;});
    var diff=WORDS.filter(function(o){var g=firstLetter(o.w);return g!==f&&!startsWithHamza(o.w)&&(NEAR[f]||'').indexOf(g)<0;});
    if(!same.length)return;
    var g=same[Math.floor(Math.random()*same.length)],L=letterObj(f);
    r.push({q:'أيّ صورة تبدأ بالصوت نفسه مثل « '+t.w+' » ؟',say:'أي صورة تبدأ بالصوت نفسه مثل '+t.w,key:'L:'+f,
      scene:'<div class="scene">'+t.e+'<div style="font-size:24px">'+t.w+'</div></div>',
      fb:'نعم! « '+t.w+' » و« '+g.w+' » تبدآن بحرف '+(L?L.n:f)+'.',
      opts:shuffle([{e:g.e,w:g.w,ok:true}].concat(pickN(diff,2).map(function(o){return {e:o.e,w:o.w};})))});
  });
  return r;
}
function genLonger(){
  var r=[];
  for(var k=0;k<5;k++){
    var a=pickN(SYL.filter(function(x){return x.s.length===1;}),1)[0];
    var b=pickN(SYL.filter(function(x){return x.s.length>=3;}),1)[0];
    r.push({q:'قُل الكلمتين بصوت عالٍ: أيّهما أطول عند النطق؟',say:'أي الكلمتين أطول عند النطق',
      fb:'نعم! « '+b.w+' » فيها '+b.s.length+' مقاطع، و« '+a.w+' » فيها مقطع واحد.',
      opts:shuffle([{e:b.e,w:b.w,ok:true},{e:a.e,w:a.w}])});
  }
  return r;
}

function harOpt(h,ok){return {html:'<span class="hmark">ـ'+h.m+'</span><span class="w">'+h.n+'</span>',ok:!!ok};}
function genWhichHaraka(){
  return pickN(HLET,6).map(function(L){
    var hi=Math.floor(Math.random()*3),h=HAR[hi];
    return {q:'ما الحركة التي على هذا الحرف؟',say:L+h.m,key:'H:'+h.n,
      scene:'<div class="bigsyl">'+L+h.m+'</div>',
      fb:'نعم! هذه '+h.n+'، وهي '+h.pos+'.',
      opts:HAR.map(function(x,i){return harOpt(x,i===hi);})};
  });
}
function genFirstSyl(){
  var r=[];
  shuffle(Object.keys(HSETS)).slice(0,6).forEach(function(L){
    var hi=Math.floor(Math.random()*3),wd=HSETS[L][hi],h=HAR[hi];
    r.push({q:'بأيّ مقطع تبدأ كلمة « '+wd[0]+' » ؟',say:wd[0],key:'H:'+h.n,
      scene:'<div class="scene">'+wd[1]+'<div style="font-size:30px">'+wd[0]+'</div></div>',
      fb:'نعم! « '+wd[0]+' » تبدأ بـ '+L+h.m+' ('+h.n+').',
      opts:HAR.map(function(x,i){return {txt:L+x.m,ok:i===hi};})});
  });

}
function genHearSyl(){
  return pickN(HLET,6).map(function(L){
    var hi=Math.floor(Math.random()*3),h=HAR[hi];
    return {q:'اِسمع المقطع 🔊 ثمّ اضغط على المقطع الذي سمعته.',say:L+h.m,key:'H:'+h.n,
      fb:'نعم! سمعت '+L+h.m+'.',
      opts:shuffle(HAR.map(function(x,i){return {txt:L+x.m,ok:i===hi};}))};
  });
}
function genVocWord(){
  var r=[];
  shuffle(Object.keys(HSETS)).slice(0,6).forEach(function(L){
    var hi=Math.floor(Math.random()*3),wd=HSETS[L][hi],w=wd[0];
    var vars=HAR.map(function(x){return w.charAt(0)+x.m+w.slice(2);});
    r.push({q:'اِسمع الكلمة 🔊 واختر كتابتها الصحيحة.',say:w,key:'H:'+HAR[hi].n,
      scene:'<div class="scene">'+wd[1]+'</div>',
      fb:'نعم! نكتبها: '+w,
      opts:shuffle(vars.map(function(v,i){return {txt:v,ok:i===hi};}))});
  });
  return r;
}

/* ---------- مراجعة تكيّفية ---------- */
function roundFirstLetterFor(L){
  var ws=WORDS.filter(function(o){return !startsWithHamza(o.w)&&firstLetter(o.w)===norm(L);});
  if(!ws.length)return null;
  var o=ws[Math.floor(Math.random()*ws.length)];
  var others=shuffle(LETTERS.map(function(x){return x.l;}).filter(function(l){return l!==norm(L);})).slice(0,3);
  return {q:'بأيّ حرف تبدأ كلمة « '+o.w+' » ؟',say:o.w,key:'L:'+norm(L),
    scene:'<div class="scene">'+o.e+'</div>',
    opts:shuffle([norm(L)].concat(others)).map(function(l){return {txt:l,ok:l===norm(L)};})};
}
function roundCountFor(n){
  var ems=['🍎','🐝','⭐','🌸','🐟','🚗','🥕','🎈','🐤','🍋'],em=ems[n%ems.length];
  return {q:'عُدّ الصور ثم اختر العدد المناسب.',say:'عد الصور واختر العدد المناسب',key:'N:'+n,
    scene:'<div class="scene">'+repEm(em,n)+'</div>',opts:numOpts(n,N10)};
}
function genReview(){
  var ls=weakKeys('L:').map(function(k){return k.slice(2);}).filter(function(l){return l!=='ا';});
  var ns=weakKeys('N:').map(function(k){return +k.slice(2);}).filter(function(n){return n>=1&&n<=10;});
  var hs=weakKeys('H:').map(function(k){return k.slice(2);});
  LETTERS.forEach(function(L){if(L.l!=='ا'&&ls.length<4&&!ITEMS['L:'+L.l]&&ls.indexOf(L.l)<0)ls.push(L.l);});
  N10.forEach(function(n){if(ns.length<2&&!ITEMS['N:'+n]&&ns.indexOf(n)<0)ns.push(n);});
  var r=[];
  ls.slice(0,5).forEach(function(L){var x=roundFirstLetterFor(L);if(x)r.push(x);});
  ns.slice(0,2).forEach(function(n){r.push(roundCountFor(n));});
  if(hs.length){var h=genWhichHaraka()[0];r.push(h);}
  return shuffle(r).slice(0,8);
}

ENGINES.clap={
  start:function(act,rounds){this.rounds=rounds;CUR.miss=[];this.show();},
  show:function(){
    var self=this,r=this.rounds[CUR.i];
    if(!r)return finishActivity();
    var count=0,tried=false;
    stage().innerHTML=promptBar('قُل الكلمة وصفّق مع كل مقطع: اضغط 👏 مرّة لكل مقطع، ثمّ تحقّق.','قل الكلمة وصفق مع كل مقطع')+
      '<div class="scene">'+r.e+'<div style="font-size:30px">'+r.w+' <button class="speak-btn" data-say="'+r.w+'">🔊</button></div></div>'+
      '<div style="text-align:center;margin:8px 0"><button class="clapbtn" id="clap">👏</button></div>'+
      '<div class="clapdots" id="dots"></div>'+
      '<div class="tools" style="justify-content:center"><button class="btn" id="ck">✔ '+T('check')+'</button><button class="btn ghost" id="rz">↺ '+fr('من جديد','Recommencer')+'</button></div>'+
      '<div class="fbline" id="fbl"></div>';
    bindSpeak(stage());speak(r.w);
    function paint(){$('#dots').innerHTML=new Array(count+1).join('<span class="dot">👏</span>');}
    $('#clap').onclick=function(){if(count<6){count++;sfxTap();paint();}};
    $('#rz').onclick=function(){count=0;paint();};
    $('#ck').onclick=function(){
      var n=r.s.length,seg='<span class="sylrow">'+r.s.map(function(p){return '<span class="syl">'+p+'</span>';}).join('<span class="plus">-</span>')+'</span>';
      if(count===n){
        sfxGood();toast(praise());
        $('#fbl').innerHTML='✔ نعم! « '+r.w+' » فيها '+(n===1?'مقطع واحد':(n===2?'مقطعان':n+' مقاطع'))+': '+seg;
        speakSeq(r.s);$('#ck').disabled=true;$('#clap').disabled=true;
        roundDone(!tried);setTimeout(function(){self.show();},2600);
      }else{
        sfxBad();tried=true;
        $('#fbl').innerHTML='💡 استمع جيّدًا وصفّق مع كل مقطع: '+seg;
        speakSeq(r.s);count=0;setTimeout(paint,300);
      }
    };
  }
};

    stage().innerHTML=promptBar('رحلة الهدهد إلى العشّ '+svgNest()+': نلعب وحدنا أم مع شخص آخر؟','رحلة الهدهد إلى العش. نلعب وحدنا أم مع شخص آخر؟')+
      '<div class="tools" style="justify-content:center">'+
      '<button class="btn" id="b1">🧒 '+fr('لاعب واحد','Un joueur')+'</button>'+
      '<button class="btn ghost" id="b2">🧒👩 '+fr('لاعبان','Deux joueurs')+'</button></div>';
    bindSpeak(stage());
    $('#b1').onclick=function(){self.setup(1);};
    $('#b2').onclick=function(){self.setup(2);};
  },
  setup:function(np){
    this.np=np;this.pos=[0,0];this.turn=0;this.trips=0;this.deck=[];
    this.round();
  },
  draw:function(){
    if(!this.deck.length)this.deck=shuffle([1,1,2,2,3,3]);
    return this.deck.pop();
  },
  boardHtml:function(){
    var self=this,cells='';
    for(var i=1;i<=10;i++){
      var here=[];
      if(self.pos[0]===i)here.push('🧒');
      if(self.np===2&&self.pos[1]===i)here.push('👩');
      cells+='<div class="bcell'+(i===10?' nest':'')+'" data-c="'+i+'"><span class="bn">'+i+'</span><span class="bp">'+here.join('')+'</span></div>';
    }
    var start=[];if(self.pos[0]===0)start.push('🧒');if(self.np===2&&self.pos[1]===0)start.push('👩');
    return '<div class="boardrow" id="brd"><div class="bcell start"><span class="bn">🏁</span><span class="bp">'+start.join('')+'</span></div>'+cells+'<div class="bcell goal">'+svgNest()+'</div></div>';
  },
  round:function(){
    var self=this,p=this.turn,who=this.np===2?(p===0?'🧒':'👩'):'🧒';
    var n=this.draw();
    stage().innerHTML=promptBar(who+' قطف الهدهد تفّاحًا. عُدّ التفّاحات، ثمّ اختر العدد.','عد التفاحات ثم اختر العدد')+
      this.boardHtml()+
      '<div class="basket2">'+repEm('🍎',n,44)+'</div>'+
      '<div class="opts" id="opts" style="grid-template-columns:repeat(3,1fr);direction:ltr">'+
      [1,2,3].map(function(x){return '<button class="opt txt" data-n="'+x+'">'+x+'</button>';}).join('')+'</div>'+
      '<div class="fbline" id="fbl"></div>';
    bindSpeak(stage());speak('عد التفاحات ثم اختر العدد');
    var tried=false;
    $$('#opts .opt').forEach(function(b){
      b.onclick=function(){
        if(+b.dataset.n===n){
          b.classList.add('good');sfxGood();track('N:'+n,!tried);
          $$('#opts .opt').forEach(function(x){x.disabled=true;});
          self.walk(n);
        }else{b.classList.add('bad');sfxBad();tried=true;setTimeout(function(){b.classList.remove('bad');},450);}
      };
    });
  },
  walk:function(n){
    var self=this,p=this.turn,left=Math.min(n,10-this.pos[p]);
    $('#fbl').innerHTML='👣 '+fr('اضغط على اللوحة لتتقدّم خطوة… وقل العدد!','Touche le plateau pour avancer d\'une case… et dis le nombre !')+' <b>'+left+'</b>';
    speak('اضغط على اللوحة لتتقدم '+NUMW[left]+' خطوات');
    function onTap(){
      if(left<=0)return;
      self.pos[p]++;left--;sfxTap();
      speak(NUMW[self.pos[p]]);
      $('#brd').outerHTML=self.boardHtml();
      var b2=$('#brd');
      $('#fbl').innerHTML=left>0?('👣 <b>'+left+'</b>'):('✔ '+fr('أنت الآن في الخانة','Tu es sur la case')+' '+self.pos[p]);
      if(left>0){b2.classList.add('active');b2.onclick=onTap;}
      else setTimeout(function(){self.after();},1100);
    }
    var brd=$('#brd');brd.classList.add('active');brd.onclick=onTap;
  },
  after:function(){
    var self=this,p=this.turn;
    if(this.pos[p]>=10){
      sfxWin();toast('🏠 '+praise());speak('وصلت إلى العش! أحسنت');
      if(this.np===1){
        this.trips++;CUR.score++;CUR.i=this.trips;updateBar();
        if(this.trips>=3)return finishActivity(3,3);
        this.pos=[0,0];
        stage().innerHTML=promptBar('وصلت إلى العشّ! رحلة جديدة؟','وصلت إلى العش، رحلة جديدة')+this.boardHtml()+
          '<div class="tools" style="justify-content:center"><button class="btn" id="again">▶️ رحلة '+(this.trips+1)+' / 3</button></div>';
        bindSpeak(stage());$('#again').onclick=function(){self.round();};
        return;
      }
      if(this.pos[0]>=10&&this.pos[1]>=10){CUR.i=3;updateBar();return finishActivity(3,3);}
    }
    if(this.np===2){
      var other=1-p;
      if(this.pos[other]<10)this.turn=other;
    }
    this.round();
  }
};

/* ---------- ألوّن علم بلادي ---------- */

    for(var i=0;i<10;i++){var a=i*36*Math.PI/180,rr=(i%2)?R2:R1;pts.push((sc+rr*Math.cos(a)).toFixed(2)+','+(100-rr*Math.sin(a)).toFixed(2));}
    var base='#ECE6DA';
    var svg='<svg id="fsvg" viewBox="0 0 300 200" style="width:100%;max-width:520px;height:auto;border:4px solid var(--line);border-radius:12px;background:#fff">'+
      '<g stroke="#2B2B2B" stroke-width="2">'+
      '<rect class="rg" data-r="hoist" x="1" y="1" width="149" height="198" fill="'+base+'"/>'+
      '<rect class="rg" data-r="fly" x="150" y="1" width="149" height="198" fill="'+base+'"/>'+
      '<path class="rg" data-r="cres" d="M193.24,74.9 A50,50 0 1,0 193.24,125.1 A40,40 0 1,1 193.24,74.9 Z" fill="'+base+'"/>'+
      '<polygon class="rg" data-r="star" points="'+pts.join(' ')+'" fill="'+base+'"/></g></svg>';
    var PAL=[['#1E8A4C','أخضر'],['#FFFFFF','أبيض'],['#D7443E','أحمر'],['#F2B705','أصفر'],['#1668C4','أزرق'],['#23313D','أسود']];
    stage().innerHTML=promptBar('لوّن علم بلادي بألوانه الصحيحة، ثمّ اضغط تحقّق.','لون علم بلادي بألوانه الصحيحة ثم اضغط تحقق')+
      '<div style="text-align:center">'+svg+'</div>'+
      '<div class="tools" style="justify-content:center">'+PAL.map(function(c,i){
        return '<button class="swatch" data-col="'+c[0]+'" title="'+c[1]+'" style="background:'+c[0]+'" aria-pressed="'+(i===0)+'"></button>';}).join('')+'</div>'+
      '<div class="tools" style="justify-content:center"><button class="btn" id="ck">✔ '+T('check')+'</button></div>'+
      '<div class="fbline" id="fbl"></div>';
    bindSpeak(stage());speak('لون علم بلادي بألوانه الصحيحة');
    var col=PAL[0][0];
    $$('[data-col]').forEach(function(b){b.onclick=function(){col=b.dataset.col;
      $$('[data-col]').forEach(function(x){x.setAttribute('aria-pressed',x===b);});sfxTap();};});
    $$('#fsvg .rg').forEach(function(r){r.style.cursor='pointer';r.addEventListener('click',function(){r.setAttribute('fill',col);sfxTap();});});
    var WANT={hoist:['#1E8A4C','الجزء القريب من السارية لونه أخضر.'],fly:['#FFFFFF','الجزء الآخر لونه أبيض.'],
              cres:['#D7443E','الهلال لونه أحمر.'],star:['#D7443E','النجمة لونها حمراء.']};
    var tried=false;
    $('#ck').onclick=function(){
      var wrong=[];
      Object.keys(WANT).forEach(function(k){
        var f=($('#fsvg [data-r="'+k+'"]').getAttribute('fill')||'').toUpperCase();
        if(f!==WANT[k][0].toUpperCase())wrong.push(WANT[k][1]);
      });
      if(!wrong.length){
        sfxGood();$('#fbl').textContent='✔ أحسنت! علم الجزائر: أخضر وأبيض، وفي وسطه هلال ونجمة حمراوان.';
        speak('أحسنت! علم الجزائر أخضر وأبيض، وفي وسطه هلال ونجمة حمراوان');
        CUR.i=1;updateBar();setTimeout(function(){finishActivity(tried?0.7:1,1);},2200);
      }else{
        sfxBad();tried=true;$('#fbl').textContent='💡 '+wrong[0];speak(wrong[0]);
      }
    };
  }
};

/* ---------- القصّة الحوارية: تُقرأ جملة جملة مع أسئلة ---------- */
ENGINES.story.start=function(act){
  var st=act.story,self=this,i=0,asked={};
  CUR.n=2;
  function lineHtml(k){var l=st.lines[k];
    return '<div class="story-line"><span class="em">'+l.e+'</span><span style="flex:1">'+l.t+'</span>'+
      '<button class="speak-btn" data-say="'+l.t.replace(/"/g,'')+'">🔊</button></div>';}
  function draw(extra){
    var html=promptBar('استمع إلى القصّة، وأجب عن أسئلة الهدهد بصوت عالٍ.','استمع إلى القصة')+'<div id="lines">';
    for(var k=0;k<=i;k++)html+=lineHtml(k);
    html+='</div>'+(extra||'')+'<div class="tools" style="justify-content:center;margin-top:14px" id="stTools"></div>';
    stage().innerHTML=html;bindSpeak(stage());
  }
  function step(){
    if(st.asks&&st.asks[i]&&!asked[i]){
      asked[i]=1;
      var q=st.asks[i];
      draw('<div class="askcard">🤔 '+q+'<div class="hint">'+(APP.coplay?'👪 اسأل طفلك واستمع إلى جوابه، ثمّ تابعا.':'قُل جوابك بصوت عالٍ لمن معك، ثمّ تابع.')+'</div></div>');
      speak(q);
      $('#stTools').innerHTML='<button class="btn" id="go">➜ '+fr('لنكتشف','Découvrons')+'</button>';
      $('#go').onclick=function(){next();};
      return;
    }
    next();
  }
  function next(){
    if(i<st.lines.length-1){
      i++;draw();speak(st.lines[i].t);
      $('#stTools').innerHTML='<button class="btn" id="go">▶️ '+fr('تابع','Suite')+'</button>';
      $('#go').onclick=step;
    }else{
      draw(st.me?'<div class="askcard">💬 '+st.me+'</div>':'');
      if(st.me)speak(st.me);
      $('#stTools').innerHTML='<button class="btn ghost" id="readAll">▶️ اقرأ القصّة كاملة</button><button class="btn" id="toGame">أكمل ➜</button>';
      $('#readAll').onclick=function(){speak(st.lines.map(function(l){return l.t;}).join(' '));};
      $('#toGame').onclick=function(){self.order(st);};
    }
  }
  draw();speak(st.lines[0].t);
  $('#stTools').innerHTML='<button class="btn" id="go">▶️ '+fr('تابع','Suite')+'</button>';
  $('#go').onclick=step;
};

/* ---------- الكتابة: إرجاع دقيق + نصيحة اتّجاه غير مانعة ---------- */
function traceKey(it){
  if(it.kind!=='glyph')return null;
  if(/^[0-9]$/.test(it.g))return 'N:'+it.g;
  if(it.g.length===1&&letterObj(it.g))return 'L:'+it.g;
  if(it.g.length===2&&/[َُِ]/.test(it.g.charAt(1))){
    var h=HAR.filter(function(x){return x.m===it.g.charAt(1);})[0];return h?'H:'+h.n:null;
  }
  return null;
}
ENGINES.trace.render=function(){
  var self=this,it=this.items[this.idx],failed=false;
  var chips=this.items.map(function(x,i){
    return '<button class="btn '+(i===self.idx?'':'ghost')+' sm" data-c="'+i+'">'+(self.done[x.id]?'✓ ':'')+(x.kind==='glyph'?x.g:x.e)+'</button>';
  }).join('');
  stage().innerHTML=promptBar('<b>'+it.t+'</b> — '+it.hint+' '+(it.e||''),it.say)+
    '<div class="padwrap"><canvas class="pad" id="pad"></canvas></div>'+
    '<div class="tools">'+
      '<button class="btn" id="ck">✔ '+T('check')+'</button>'+
      '<button class="btn ghost" id="cl">🧽 '+T('clear')+'</button>'+
      '<button class="btn ghost" id="dm">👀 '+T('watch')+'</button>'+
      '<span class="score-badge" id="sc"></span>'+
    '</div>'+
    '<div class="fbline" id="fbl"></div>'+
    '<div class="tools" style="margin-top:6px">'+chips+'</div>';
  bindSpeak(stage());speak(it.say);
  $$('[data-c]').forEach(function(b){b.onclick=function(){self.idx=+b.dataset.c;self.render();};});
  this.pad=makePad($('#pad'),it);
  $('#cl').onclick=function(){self.pad.clear();$('#sc').textContent='';$('#fbl').textContent='';};
  $('#dm').onclick=function(){self.pad.demo();};
  setTimeout(function(){if(self.pad&&self.items[self.idx]===it)self.pad.demo();},600);
  $('#ck').onclick=function(){
    var s=self.pad.score(),d=self.pad.detail(),dir=self.pad.direction();
    var pct=Math.round(s*100),key=traceKey(it);
    var tip='';
    if(dir&&!dir.ok)tip=dir.kind==='rtl'?'💡 تذكّر: نكتب من اليمين إلى اليسار.':'💡 تذكّر: نبدأ من النقطة الخضراء 🟢.';
    if(s>=0.55){
      var good=[];
      if(d.coverage>=0.85)good.push('اتّبعتَ الشكل كلّه');
      if(d.precision>=0.85)good.push('وبقيتَ قريبًا من الخطّ');
      if(dir&&dir.ok)good.push('وبدأتَ من المكان الصحيح');
      var msg=good.length?('أحسنت! '+good.join('، ')+'.'):praise();
      $('#sc').innerHTML='<span style="color:var(--ok)">'+(s>=0.8?'★★★':'★★☆')+' '+pct+'%</span>';
      $('#fbl').textContent='✔ '+msg+(tip?' '+tip:'');
      sfxGood();speak(msg);
      if(!self.done[it.id]){self.done[it.id]=1;CUR.score+=(s>=0.8?1:0.7);CUR.i++;updateBar();track(key,!failed&&s>=0.8);}
      setTimeout(function(){
        var nx=-1;
        for(var i=0;i<self.items.length;i++){var j=(self.idx+1+i)%self.items.length;if(!self.done[self.items[j].id]){nx=j;break;}}
        if(nx<0)finishActivity(CUR.score,CUR.n);
        else{self.idx=nx;self.render();}
      },tip?2600:1700);
    }else{
      var hint=d.coverage<0.5?'أكمل الأجزاء الناقصة من الشكل.':(d.precision<0.6?'حاول أن تبقى فوق الخطّ المنقّط.':'اتبع الخطّ جيّدًا وحاول مرّة أخرى.');
      $('#sc').innerHTML='<span style="color:var(--no)">'+pct+'%</span>';
      $('#fbl').textContent='💡 '+hint+(tip?' '+tip:'');
      sfxBad();speak(hint);
      if(!failed){failed=true;track(key,false);}
    }
  };
};
